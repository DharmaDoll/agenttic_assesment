# UI-only PoC: ARTEX/DB have no model credentials, target or outbound network.
services:
  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    entrypoint: [nginx, -g, "daemon off;"]
    user: "101:101"
    depends_on:
      artex:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [entry, ui]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/auth/status]
      interval: 5s
      timeout: 4s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: artex
      POSTGRES_DB: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [ui]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  artex:
    build:
      context: ../../var/artex/source
      # WSL bridge download failures can require host networking during build only.
      network: ${ARTEX_BUILD_NETWORK:-default}
      args:
        ARTEX_VERSION: ${ARTEX_REV:?Run make setup first}
    image: agenttic-artex:${ARTEX_REV:?Run make setup first}
    depends_on:
      postgres:
        condition: service_healthy
    user: "${ARTEX_UID:?Run make setup first}:${ARTEX_GID:?Run make setup first}"
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_JWT_KEY_DIR: /app/keys
      ARTEX_TRUSTED_PROXIES: ""
    volumes:
      - ../../var/artex/data:/app/data
      - ../../var/artex/keys:/app/keys
      - ../../var/artex/source/skills:/app/skills:ro
    networks: [ui]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stop_grace_period: 10s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:8787/api/auth/status]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  entry:
  ui:
    internal: true
volumes:
  pgdata:
